# General configurations used by templates (Prometheus, Datadog, Grafana Cloud, OTel)
metric_name: "checkout_flow_errors"
name: "Checkout Flow Availability"
description: "SLO alerts for the checkout flow error budget."
namespace: "billing-prod"
runbook_url: "https://wiki.example.com/runbooks/checkout-alerts"

# Labels/tags that will be added to alerts or resources
rule_labels:
  team: payments
  tier: critical

# Optional per-severity label overrides (vendor-neutral, e.g. for routing or on-call)
severity_labels:
  page:
    urgency: high
  message:
    urgency: medium
  ticket:
    urgency: low

# Optional base and per-severity annotation overrides
rule_annotations:
  dashboard_url: "https://grafana.example.com/d/checkout-slo"

severity_annotations:
  page:
    action: "Escalate to on-call engineer immediately"

# Metadata labels for wrapped resources (e.g. Kubernetes resources)
meta_labels:
  name: checkout-slo-alerts
  role: alert-rules

# Datadog specific configs
tags:
  - "env:prod"
  - "service:checkout"
  - "team:payments"

# OpenTelemetry and Incident.io service identification
service_name: "checkout-service"
receiver: "otlp"
exporter: "prometheus"

# Incident.io specific configs (used by --template incident-io)
source_type: "custom"
severity_map:
  page: "critical"
  message: "major"
  ticket: "minor"
